<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SIENA MARGEM</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#030604;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

button,input{
font-family:inherit;
}

body{
height:100dvh;
}

.app{
width:100%;
height:100dvh;
max-width:500px;
margin:auto;
padding:
env(safe-area-inset-top)
14px
env(safe-area-inset-bottom);

display:flex;
flex-direction:column;

background:
radial-gradient(
circle at 50% 0%,
#12351c 0%,
#08140c 28%,
#030604 70%
);
}


/* TOPO */

.top{
height:16%;
min-height:100px;

display:grid;
grid-template-columns:52px 1fr 52px;
align-items:center;
}

.topButton{
width:45px;
height:45px;

border-radius:14px;

border:1px solid #315d32;

background:#071009;

color:#fff;

font-size:23px;
}

.brand{
text-align:center;
line-height:.9;
}

.brandSiena{
font-size:clamp(42px,11vw,62px);
font-weight:1000;
letter-spacing:-2px;
color:#fff;
}

.brandMargem{
font-size:clamp(19px,5vw,27px);
font-weight:900;
letter-spacing:7px;
color:#54e51b;
margin-top:7px;
}

.brandSub{
font-size:9px;
font-weight:bold;
letter-spacing:3px;
color:#8b948d;
margin-top:8px;
}


/* ABAS */

.tabs{
height:8%;
min-height:45px;

display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;

margin-bottom:7px;
}

.tab{
border-radius:12px;

border:1px solid #26372a;

background:#071009;

color:#8d968f;

font-size:10px;
font-weight:900;
}

.tab.active{
background:#54e51b;
color:#061006;
border-color:#54e51b;

box-shadow:
0 0 18px rgba(84,229,27,.2);
}


/* CAMPOS */

.fields{
height:25%;
min-height:155px;

border:1px solid #26372a;
border-radius:18px;

padding:10px;

background:
linear-gradient(
145deg,
rgba(17,30,19,.92),
rgba(5,11,7,.96)
);

display:flex;
flex-direction:column;
justify-content:center;
gap:8px;
}

.field{
flex:1;
min-height:0;
}

.label{
display:block;

font-size:9px;
font-weight:900;
letter-spacing:.8px;

color:#a5ada7;

margin-bottom:4px;
}

.inputBox{
height:calc(100% - 14px);
min-height:38px;

display:flex;
align-items:center;

border:1px solid #26372a;
border-radius:12px;

background:#020603;

overflow:hidden;
}

.prefix{
padding-left:12px;
padding-right:8px;

color:#54e51b;

font-weight:900;
font-size:17px;
}

.inputBox input{
width:100%;
height:100%;

border:0;
outline:0;

background:transparent;

color:#fff;

font-size:18px;
font-weight:800;

padding:0 8px;

min-width:0;
}

.suffix{
padding:0 12px;

color:#54e51b;

font-size:18px;
font-weight:900;
}


/* RESULTADO */

.result{
height:17%;
min-height:105px;

margin-top:7px;

border-radius:18px;

border:1px solid #4c9b31;

background:
radial-gradient(
circle at 80% 0%,
rgba(84,229,27,.16),
transparent 45%
),
#061008;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.resultLabel{
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
color:#9ca59e;
}

.resultValue{
font-size:clamp(32px,9vw,47px);
font-weight:1000;
color:#54e51b;
line-height:1;

margin:5px 0 8px;
}

.resultInfo{
width:85%;

display:grid;
grid-template-columns:1fr 1fr;

border-top:1px solid #253429;

padding-top:7px;

text-align:center;
}

.resultInfo div:first-child{
border-right:1px solid #253429;
}

.resultInfo small{
display:block;
font-size:8px;
color:#7d877f;
margin-bottom:3px;
}

.resultInfo strong{
font-size:13px;
}


/* AÇÕES */

.actions{
height:7%;
min-height:40px;

display:grid;
grid-template-columns:1.6fr 1fr;

gap:7px;

margin-top:7px;
}

.action{
border-radius:12px;

border:1px solid #2d432f;

background:#071009;

color:#fff;

font-weight:900;
font-size:12px;
}

.action.calculate{
background:#54e51b;
color:#061006;
border-color:#54e51b;
}


/* TECLADO */

.keypad{
height:26%;
min-height:150px;

display:grid;

grid-template-columns:repeat(4,1fr);

grid-template-rows:repeat(4,1fr);

gap:6px;

margin-top:7px;
}

.key{
border-radius:12px;

border:1px solid #26372a;

background:
linear-gradient(
145deg,
#121b15,
#070d09
);

color:#fff;

font-size:20px;
font-weight:900;
}

.key:active{
transform:scale(.95);
}

.key.green{
color:#54e51b;
}

.key.equal{
background:#54e51b;
color:#061006;

font-size:28px;

border-color:#54e51b;
}

.key.zero{
grid-column:span 2;
}


/* RODAPÉ */

.footer{
height:3%;
min-height:20px;

display:flex;
align-items:center;
justify-content:center;

font-size:8px;
color:#69736c;
}

.footer span{
color:#54e51b;
font-weight:bold;
margin-left:3px;
}


/* MENU */

.overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,.75);

display:none;

z-index:50;
}

.overlay.show{
display:block;
}

.menu{
position:fixed;

z-index:60;

top:0;
left:-310px;

width:290px;
height:100dvh;

padding:30px 18px;

background:#071009;

border-right:1px solid #29432d;

transition:.25s;
}

.menu.show{
left:0;
}

.menuLogo{
font-size:27px;
font-weight:1000;
}

.menuLogo span{
color:#54e51b;
}

.menuSub{
font-size:9px;
letter-spacing:2px;

color:#778078;

margin:5px 0 25px;
}

.menuButton{
width:100%;

padding:15px;

margin-bottom:9px;

border-radius:13px;

border:1px solid #26372a;

background:#0d1810;

color:#fff;

text-align:left;

font-weight:bold;
}


/* MODAL */

.modal{
position:fixed;

inset:0;

z-index:100;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:rgba(0,0,0,.8);
}

.modal.show{
display:flex;
}

.modalBox{
width:100%;
max-width:430px;

max-height:80dvh;

overflow:auto;

padding:20px;

border-radius:18px;

border:1px solid #29432d;

background:#071009;
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

.modalHead h2{
margin:0;
font-size:19px;
}

.close{
border:0;
background:none;
color:#fff;
font-size:26px;
}

.info{
padding:14px;

margin-bottom:9px;

border-radius:13px;

border:1px solid #26372a;

background:#0d1810;
}

.info strong{
color:#54e51b;
}

.info p{
font-size:12px;

line-height:1.5;

color:#a2aaa4;
}


/* CELULAR */

@media(max-height:700px){

.top{
height:14%;
min-height:85px;
}

.brandSiena{
font-size:42px;
}

.brandMargem{
font-size:18px;
margin-top:4px;
}

.brandSub{
font-size:7px;
margin-top:5px;
}

.tabs{
height:8%;
}

.fields{
height:24%;
padding:8px;
gap:5px;
}

.result{
height:17%;
min-height:90px;
}

.resultValue{
font-size:30px;
}

.actions{
height:7%;
}

.keypad{
height:27%;
min-height:140px;
gap:5px;
}

.key{
font-size:17px;
}

}


@media(max-height:620px){

.brandSiena{
font-size:35px;
}

.brandMargem{
font-size:15px;
}

.topButton{
width:38px;
height:38px;
}

.fields{
height:23%;
}

.result{
height:16%;
}

.keypad{
height:29%;
}

.footer{
display:none;
}

}

</style>

</head>

<body>


<div class="app">


<!-- TOPO -->

<div class="top">

<button
class="topButton"
onclick="abrirMenu()">
☰
</button>

<div class="brand">

<div class="brandSiena">
SIENA
</div>

<div class="brandMargem">
MARGEM
</div>

<div class="brandSub">
SIMULADOR COMERCIAL
</div>

</div>

<button
class="topButton"
onclick="abrirSobre()">
ⓘ
</button>

</div>


<!-- ABAS -->

<div class="tabs">

<button
class="tab active"
onclick="trocarModo('margem',this)">
MARGEM
</button>

<button
class="tab"
onclick="trocarModo('preco',this)">
PREÇO
</button>

<button
class="tab"
onclick="trocarModo('desconto',this)">
DESCONTO
</button>

<button
class="tab"
onclick="trocarModo('markup',this)">
MARKUP
</button>

</div>


<!-- CAMPOS -->

<div
class="fields"
id="fields">
</div>


<!-- RESULTADO -->

<div class="result">

<div
class="resultLabel"
id="resultLabel">
PREÇO DE VENDA
</div>

<div
class="resultValue"
id="resultValue">
R$ 0,00
</div>

<div class="resultInfo">

<div>

<small id="info1Label">
LUCRO
</small>

<strong id="info1">
R$ 0,00
</strong>

</div>

<div>

<small id="info2Label">
MARGEM
</small>

<strong id="info2">
0,00%
</strong>

</div>

</div>

</div>


<!-- AÇÕES -->

<div class="actions">

<button
class="action calculate"
onclick="calcular()">

▣ &nbsp; CALCULAR

</button>

<button
class="action"
onclick="limpar()">

↻ &nbsp; LIMPAR

</button>

</div>


<!-- TECLADO -->

<div class="keypad">

<button class="key"
onclick="digitar('7')">
7
</button>

<button class="key"
onclick="digitar('8')">
8
</button>

<button class="key"
onclick="digitar('9')">
9
</button>

<button class="key green"
onclick="apagar()">
⌫
</button>


<button class="key"
onclick="digitar('4')">
4
</button>

<button class="key"
onclick="digitar('5')">
5
</button>

<button class="key"
onclick="digitar('6')">
6
</button>

<button class="key green"
onclick="digitar('00')">
00
</button>


<button class="key"
onclick="digitar('1')">
1
</button>

<button class="key"
onclick="digitar('2')">
2
</button>

<button class="key"
onclick="digitar('3')">
3
</button>

<button class="key green"
onclick="digitar(',')">
,
</button>


<button
class="key zero"
onclick="digitar('0')">
0
</button>

<button
class="key"
onclick="digitar(',')">
,
</button>

<button
class="key equal"
onclick="calcular()">
=
</button>

</div>


<div class="footer">

Criado e desenvolvido por

<span>
João Siena
</span>

</div>


</div>


<!-- MENU -->

<div
class="overlay"
id="overlay"
onclick="fecharMenu()">
</div>


<div
class="menu"
id="menu">

<div class="menuLogo">
SIENA <span>MARGEM</span>
</div>

<div class="menuSub">
SIMULADOR COMERCIAL
</div>


<button
class="menuButton"
onclick="abrirHistorico()">
◷ &nbsp; Histórico
</button>


<button
class="menuButton"
onclick="abrirInformacoes()">
∑ &nbsp; Informações técnicas
</button>


<button
class="menuButton"
onclick="abrirSobre()">
ⓘ &nbsp; Sobre o SIENA
</button>

</div>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modalBox">

<div class="modalHead">

<h2 id="modalTitle">
SIENA MARGEM
</h2>

<button
class="close"
onclick="fecharModal()">
×
</button>

</div>

<div id="modalContent">
</div>

</div>

</div>


<script>


let modo="margem";

let campoAtivo=null;


/* CONFIGURAÇÕES */

const modos={

margem:{

campos:[
["custo","CUSTO DO PRODUTO","R$","0"],
["margem","MARGEM DESEJADA","%","0"]
],

resultado:"PREÇO DE VENDA",

info1:"LUCRO",

info2:"MARGEM"

},

preco:{

campos:[
["custo","CUSTO DO PRODUTO","R$","0"],
["preco","PREÇO DE VENDA","R$","0"]
],

resultado:"MARGEM OBTIDA",

info1:"LUCRO",

info2:"MARKUP"

},

desconto:{

campos:[
["precoTabela","PREÇO DE TABELA","R$","0"],
["desconto","DESCONTO","%","0"]
],

resultado:"PREÇO FINAL",

info1:"ECONOMIA",

info2:"DESCONTO"

},

markup:{

campos:[
["custo","CUSTO DO PRODUTO","R$","0"],
["markup","MARKUP","x","0"]
],

resultado:"PREÇO DE VENDA",

info1:"LUCRO",

info2:"MARGEM"

}

};


/* MONTA CAMPOS */

function montarCampos(){

let config=modos[modo];

let html="";

config.campos.forEach(c=>{

html+=`

<div class="field">

<label class="label">
${c[1]}
</label>

<div class="inputBox">

<span class="prefix">
${c[2]}
</span>

<input
id="${c[0]}"
value="0"
inputmode="decimal"
onclick="campoAtivo=this"
onfocus="campoAtivo=this"
oninput="calcular()"
>

</div>

</div>

`;

});

document.getElementById("fields").innerHTML=html;


/* SUFIXOS */

config.campos.forEach(c=>{

if(c[2]==="%"){

document
.getElementById(c[0])
.parentElement
.insertAdjacentHTML(
"beforeend",
'<span class="suffix">%</span>'
);

}

if(c[2]==="x"){

document
.getElementById(c[0])
.parentElement
.insertAdjacentHTML(
"beforeend",
'<span class="suffix">x</span>'
);

}

});


campoAtivo=
document.querySelector("#fields input");

calcular();

}


/* NÚMERO */

function numero(v){

return parseFloat(
String(v||"")
.replace(/\./g,"")
.replace(",",".")
) || 0;

}


/* MOEDA */

function moeda(v){

return v.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* CALCULAR */

function calcular(){

let resultado=0;

let info1=0;

let info2=0;


/* MARGEM

Agora a porcentagem é SOMADA
ao custo.

Exemplo:

100 + 30% = 130
100 + 150% = 250
100 + 300% = 400

Sem limite.
*/

if(modo==="margem"){

let custo=
numero(
document.getElementById("custo").value
);

let margem=
numero(
document.getElementById("margem").value
);

resultado=
custo+(custo*margem/100);

info1=
resultado-custo;

info2=
margem;

}


/* PREÇO */

if(modo==="preco"){

let custo=
numero(
document.getElementById("custo").value
);

let preco=
numero(
document.getElementById("preco").value
);

if(custo>0 && preco>0){

resultado=
((preco-custo)/preco)*100;

info1=
preco-custo;

info2=
preco/custo;

}

}


/* DESCONTO */

if(modo==="desconto"){

let tabela=
numero(
document.getElementById("precoTabela").value
);

let desconto=
numero(
document.getElementById("desconto").value
);

resultado=
tabela-
(tabela*desconto/100);

info1=
tabela-resultado;

info2=
desconto;

}


/* MARKUP */

if(modo==="markup"){

let custo=
numero(
document.getElementById("custo").value
);

let markup=
numero(
document.getElementById("markup").value
);

resultado=
custo*markup;

info1=
resultado-custo;

if(resultado>0){

info2=
((resultado-custo)/resultado)*100;

}

}


/* RESULTADO */

if(modo==="preco"){

document.getElementById("resultValue")
.textContent=
resultado
.toFixed(2)
.replace(".",",")+"%";

document.getElementById("info1")
.textContent=
moeda(info1);

document.getElementById("info2")
.textContent=
info2
.toFixed(2)
.replace(".",",")+"x";

}

else{

document.getElementById("resultValue")
.textContent=
moeda(resultado);

document.getElementById("info1")
.textContent=
moeda(info1);

document.getElementById("info2")
.textContent=
info2
.toFixed(2)
.replace(".",",")+"%";

}


let config=modos[modo];

document.getElementById("resultLabel")
.textContent=
config.resultado;

document.getElementById("info1Label")
.textContent=
config.info1;

document.getElementById("info2Label")
.textContent=
config.info2;

}


/* TROCAR ABA */

function trocarModo(novo,botao){

modo=novo;

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

botao.classList.add("active");

montarCampos();

}


/* TECLADO */

function digitar(valor){

if(!campoAtivo){

campoAtivo=
document.querySelector("#fields input");

}


/* Se o campo estiver em ZERO,
substitui o zero pelo número */

if(
campoAtivo.value==="0" &&
valor!==","
){

campoAtivo.value="";

}


/* Não permite duas vírgulas */

if(
valor==="," &&
campoAtivo.value.includes(",")
){

return;

}

campoAtivo.value+=valor;

calcular();

}


/* APAGAR */

function apagar(){

if(!campoAtivo)return;

campoAtivo.value=
campoAtivo.value.slice(0,-1);

if(campoAtivo.value===""){

campoAtivo.value="0";

}

calcular();

}


/* LIMPAR */

function limpar(){

document
.querySelectorAll("#fields input")
.forEach(x=>{
x.value="0";
});

document.getElementById("resultValue")
.textContent="R$ 0,00";

document.getElementById("info1")
.textContent="R$ 0,00";

document.getElementById("info2")
.textContent="0,00%";

campoAtivo=
document.querySelector("#fields input");

}


/* MENU */

function abrirMenu(){

document
.getElementById("menu")
.classList.add("show");

document
.getElementById("overlay")
.classList.add("show");

}


function fecharMenu(){

document
.getElementById("menu")
.classList.remove("show");

document
.getElementById("overlay")
.classList.remove("show");

}


/* MODAL */

function fecharModal(){

document
.getElementById("modal")
.classList.remove("show");

}


function abrirSobre(){

fecharMenu();

document.getElementById("modalTitle")
.textContent="SIENA MARGEM";

document.getElementById("modalContent")
.innerHTML=`

<div class="info">

<strong>
Simulador Comercial
</strong>

<p>
Uma ferramenta rápida para cálculos
de margem, preço, desconto e markup.
</p>

<p>
Criado e desenvolvido por
<strong>João Siena</strong>.
</p>

</div>

`;

document
.getElementById("modal")
.classList.add("show");

}


function abrirInformacoes(){

fecharMenu();

document.getElementById("modalTitle")
.textContent=
"Informações técnicas";

document.getElementById("modalContent")
.innerHTML=`

<div class="info">

<strong>MARGEM</strong>

<p>
O percentual é aplicado sobre o custo
e somado ao valor do produto.
</p>

</div>

<div class="info">

<strong>PREÇO</strong>

<p>
Mostra a margem obtida entre o custo
e o preço de venda.
</p>

</div>

<div class="info">

<strong>DESCONTO</strong>

<p>
Calcula o preço final depois
do desconto informado.
</p>

</div>

<div class="info">

<strong>MARKUP</strong>

<p>
Multiplica o custo pelo fator
de markup informado.
</p>

</div>

`;

document
.getElementById("modal")
.classList.add("show");

}


function abrirHistorico(){

fecharMenu();

document.getElementById("modalTitle")
.textContent="Histórico";

document.getElementById("modalContent")
.innerHTML=`

<div class="info">

<strong>Nenhum cálculo salvo.</strong>

<p>
O histórico poderá ser ativado
em uma próxima versão.
</p>

</div>

`;

document
.getElementById("modal")
.classList.add("show");

}


/* INICIAR */

montarCampos();

</script>

</body>
</html>
