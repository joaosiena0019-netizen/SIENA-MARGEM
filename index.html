<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>SIENA MARGEM</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;

    overflow:hidden;

    background:#020503;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:manipulation;

    overscroll-behavior:none;
}

body{
    user-select:none;
}

button{
    font-family:inherit;
    border:0;
    outline:0;
    cursor:pointer;
}


/* =====================================================
   APLICATIVO
===================================================== */

.app{

    width:100%;
    height:100dvh;

    max-width:540px;

    margin:auto;

    padding:
        calc(env(safe-area-inset-top) + 7px)
        14px
        calc(env(safe-area-inset-bottom) + 5px);

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% -15%,
            rgba(49,130,47,.38),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #07150a 0%,
            #020503 75%
        );
}


/* =====================================================
   CABEÇALHO
===================================================== */

.header{

    height:15%;

    min-height:82px;

    display:grid;

    grid-template-columns:46px 1fr 46px;

    align-items:center;

}

.header-button{

    width:42px;
    height:42px;

    border-radius:14px;

    border:1px solid #315c36;

    background:#071109;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    transition:.1s;
}

.header-button:active{
    transform:scale(.92);
}


/* MARCA */

.logo{
    text-align:center;
    line-height:1;
}

.logo-siena{

    font-size:
        clamp(42px,11vw,60px);

    font-weight:1000;

    letter-spacing:-2px;

    color:#fff;
}

.logo-margem{

    margin-top:5px;

    font-size:
        clamp(16px,4.5vw,23px);

    font-weight:1000;

    letter-spacing:
        clamp(5px,2vw,8px);

    color:#58e51d;
}

.logo-sub{

    margin-top:6px;

    font-size:7px;

    letter-spacing:3px;

    color:#879188;

    font-weight:bold;
}


/* =====================================================
   ABAS
===================================================== */

.tabs{

    height:10%;

    min-height:55px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:6px;

    margin-bottom:7px;
}

.tab{

    min-width:0;

    border-radius:13px;

    border:1px solid #29402d;

    background:
        linear-gradient(
            145deg,
            #0b150e,
            #071009
        );

    color:#858e88;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:
        clamp(7px,2vw,10px);

    font-weight:1000;

    transition:.1s;
}

.tab svg{

    width:
        clamp(17px,4vw,22px);

    height:
        clamp(17px,4vw,22px);

    stroke:currentColor;

    fill:none;

    stroke-width:2;
}

.tab.active{

    color:#071006;

    background:#58e51d;

    border-color:#58e51d;

    box-shadow:
        0 0 18px
        rgba(88,229,29,.18);
}

.tab:active{
    transform:scale(.96);
}


/* =====================================================
   ÁREA
===================================================== */

.content{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

}


/* =====================================================
   FERRAMENTA COMERCIAL
===================================================== */

.commercial{

    height:100%;

    display:flex;

    flex-direction:column;

}


/* CAMPOS */

.fields{

    height:24%;

    min-height:108px;

    padding:9px;

    border-radius:18px;

    border:1px solid #29442f;

    background:
        rgba(5,15,8,.85);

    display:flex;

    flex-direction:column;

    gap:6px;
}

.field{

    flex:1;

    min-height:0;

}

.field-label{

    display:block;

    height:12px;

    margin-bottom:3px;

    color:#919c94;

    font-size:8px;

    font-weight:1000;

    letter-spacing:1px;
}

.field-box{

    width:100%;

    height:
        calc(100% - 15px);

    min-height:35px;

    border-radius:12px;

    border:1px solid #2d4732;

    background:#020604;

    display:flex;

    align-items:center;

    overflow:hidden;

}

.field-box.selected{

    border-color:#58e51d;

    box-shadow:
        0 0 0 1px
        rgba(88,229,29,.18);
}

.prefix{

    padding-left:12px;

    padding-right:8px;

    color:#58e51d;

    font-size:18px;

    font-weight:1000;
}

.field-value{

    flex:1;

    min-width:0;

    color:white;

    font-size:
        clamp(18px,5vw,25px);

    font-weight:900;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.suffix{

    padding-right:12px;

    color:#58e51d;

    font-size:20px;

    font-weight:1000;
}


/* =====================================================
   RESULTADO
===================================================== */

.result{

    height:20%;

    min-height:90px;

    margin-top:7px;

    border-radius:18px;

    border:1px solid #438c31;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(54,130,35,.16),
            transparent 60%
        ),
        #061008;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.result-title{

    font-size:9px;

    letter-spacing:1.5px;

    font-weight:1000;

    color:#a0aaa3;
}

.result-number{

    margin-top:5px;

    color:#58e51d;

    font-size:
        clamp(31px,9vw,47px);

    font-weight:1000;

    line-height:1;
}

.result-details{

    width:84%;

    display:grid;

    grid-template-columns:1fr 1fr;

    margin-top:8px;

    padding-top:6px;

    border-top:1px solid #29412d;

    text-align:center;
}

.result-detail:first-child{

    border-right:
        1px solid #29412d;
}

.result-detail small{

    display:block;

    font-size:7px;

    color:#7e8981;

}

.result-detail strong{

    display:block;

    margin-top:2px;

    font-size:
        clamp(11px,3vw,14px);
}


/* =====================================================
   TECLADO COMERCIAL
===================================================== */

.commercial-keypad{

    height:51%;

    min-height:210px;

    margin-top:7px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-template-rows:
        repeat(4,1fr);

    gap:6px;
}

.key{

    border-radius:14px;

    border:1px solid #29442f;

    background:
        linear-gradient(
            145deg,
            #101b13,
            #09110c
        );

    color:#fff;

    font-size:
        clamp(20px,6vw,30px);

    font-weight:900;

    transition:
        transform .07s,
        background .07s;
}

.key:active{

    transform:scale(.94);

    background:#1b2b1e;
}

.key.green{

    color:#58e51d;
}

.key.equal{

    background:#58e51d;

    border-color:#58e51d;

    color:#061006;

    font-size:30px;

    box-shadow:
        0 0 18px
        rgba(88,229,29,.16);
}

.key.zero{

    grid-column:
        span 2;
}


/* =====================================================
   CALCULADORA
===================================================== */

.calculator{

    height:100%;

    display:flex;

    flex-direction:column;
}


/* visor */

.calc-display{

    height:24%;

    min-height:105px;

    padding:
        12px
        15px;

    border-radius:18px;

    border:1px solid #29442f;

    background:#020604;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    align-items:flex-end;

    overflow:hidden;
}

.calc-expression{

    width:100%;

    min-height:22px;

    text-align:right;

    color:#78847c;

    font-size:14px;

    font-weight:bold;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    margin-bottom:7px;
}

.calc-value{

    width:100%;

    text-align:right;

    color:#fff;

    font-size:
        clamp(40px,11vw,60px);

    line-height:1;

    font-weight:1000;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* teclado completo */

.calc-keypad{

    flex:1;

    min-height:0;

    margin-top:8px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-template-rows:
        repeat(5,1fr);

    gap:6px;
}

.calc-key{

    border-radius:
        50%;

    border:1px solid #29442f;

    background:
        #111b14;

    color:white;

    font-size:
        clamp(21px,7vw,34px);

    font-weight:500;

    transition:.07s;
}

.calc-key:active{

    transform:scale(.92);

    background:#1d2c20;
}

.calc-key.operator{

    color:#58e51d;

    background:#0c170e;
}

.calc-key.equal{

    background:#58e51d;

    color:#061006;

    border-color:#58e51d;

    font-weight:900;
}

.calc-key.wide{

    border-radius:45px;
}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{

    height:4%;

    min-height:25px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#7f8982;

    font-size:8px;

    font-weight:bold;

    letter-spacing:.2px;
}

.footer span{

    color:#58e51d;

    margin-left:4px;
}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.82);
}

.modal.show{
    display:flex;
}

.modal-box{

    width:100%;

    max-width:420px;

    padding:20px;

    border-radius:18px;

    border:1px solid #315936;

    background:#071009;
}

.modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.modal-header h2{

    margin:0;

    font-size:20px;
}

.close{

    background:none;

    color:white;

    font-size:28px;
}

.modal-text{

    margin-top:15px;

    color:#9aa59d;

    font-size:13px;

    line-height:1.5;
}


/* =====================================================
   MENU
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    z-index:80;

    display:none;

    background:
        rgba(0,0,0,.7);
}

.overlay.show{
    display:block;
}

.side-menu{

    position:fixed;

    z-index:90;

    top:0;

    left:-300px;

    width:280px;

    height:100dvh;

    padding:
        calc(env(safe-area-inset-top) + 25px)
        18px;

    background:#071009;

    border-right:1px solid #29452e;

    transition:left .18s ease;
}

.side-menu.show{
    left:0;
}

.menu-title{

    font-size:25px;

    font-weight:1000;
}

.menu-title span{
    color:#58e51d;
}

.menu-item{

    width:100%;

    margin-top:10px;

    padding:15px;

    border-radius:12px;

    border:1px solid #29442f;

    background:#0d1810;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;
}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media(max-height:700px){

    .header{
        height:13%;
        min-height:70px;
    }

    .logo-siena{
        font-size:40px;
    }

    .logo-margem{
        font-size:15px;
        margin-top:3px;
    }

    .logo-sub{
        margin-top:3px;
        font-size:6px;
    }

    .tabs{
        height:9%;
        min-height:48px;
    }

    .tab{
        font-size:7px;
    }

    .tab svg{
        width:16px;
        height:16px;
    }

    .fields{
        height:22%;
        min-height:90px;
    }

    .result{
        height:19%;
        min-height:80px;
    }

    .result-number{
        font-size:30px;
    }

    .commercial-keypad{
        height:52%;
        min-height:190px;
    }

    .key{
        font-size:19px;
    }

    .footer{
        font-size:7px;
    }
}


/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media(max-height:620px){

    .header{
        min-height:60px;
    }

    .header-button{
        width:36px;
        height:36px;
    }

    .logo-siena{
        font-size:34px;
    }

    .logo-margem{
        font-size:13px;
    }

    .logo-sub{
        display:none;
    }

    .fields{
        padding:6px;
        gap:4px;
    }

    .result{
        margin-top:4px;
    }

    .commercial-keypad{
        margin-top:4px;
        gap:4px;
    }

    .key{
        border-radius:11px;
    }
}

</style>
</head>

<script>

/* =====================================================
   ESTADO COMERCIAL
===================================================== */

let modo="margem";

let campoAtivo="custo";


const dados={

custo:"0",
margem:"0",

preco:"0",

tabela:"0",
desconto:"0",

markup:"0"

};


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const modos={

margem:{

campos:[
["custo","CUSTO DO PRODUTO","R$"],
["margem","MARGEM DESEJADA (%)","%"]
],

titulo:"PREÇO DE VENDA",

d1:"LUCRO",
d2:"MARGEM"

},

preco:{

campos:[
["custo","CUSTO DO PRODUTO","R$"],
["preco","PREÇO DE VENDA","R$"]
],

titulo:"MARGEM OBTIDA",

d1:"LUCRO",
d2:"MARGEM"

},

desconto:{

campos:[
["tabela","PREÇO DE TABELA","R$"],
["desconto","DESCONTO (%)","%"]
],

titulo:"PREÇO FINAL",

d1:"ECONOMIA",
d2:"DESCONTO"

},

markup:{

campos:[
["custo","CUSTO DO PRODUTO","R$"],
["markup","MARKUP","X"]
],

titulo:"PREÇO DE VENDA",

d1:"LUCRO",
d2:"MARGEM"

}

};


/* =====================================================
   FORMATAÇÃO
===================================================== */

function numero(valor){

let texto=
String(valor)
.replace(/\./g,"")
.replace(",",".")
.trim();

let n=parseFloat(texto);

return isFinite(n) ? n : 0;

}


function moeda(valor){

if(!isFinite(valor)){
valor=0;
}

return valor.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


function percentual(valor){

if(!isFinite(valor)){
valor=0;
}

return valor
.toLocaleString(
"pt-BR",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
)+"%";

}


/* =====================================================
   MONTAR CAMPOS
===================================================== */

function montarCampos(){

let cfg=modos[modo];

let html="";

cfg.campos.forEach(function(campo){

html+=`

<div class="field">

<label class="field-label">
${campo[1]}
</label>

<div
id="box_${campo[0]}"
class="field-box"
onclick="selecionarCampo('${campo[0]}')">

<span class="prefix">
${campo[2]==="R$" ? "R$" : ""}
</span>

<span
id="value_${campo[0]}"
class="field-value">
${dados[campo[0]]}
</span>

<span class="suffix">
${campo[2]==="%" ? "%" : ""}
${campo[2]==="X" ? "×" : ""}
</span>

</div>

</div>

`;

});

document.getElementById(
"fields"
).innerHTML=html;


campoAtivo=
cfg.campos[0][0];


selecionarCampo(campoAtivo);

calcularComercial();

}


/* =====================================================
   SELECIONAR CAMPO
===================================================== */

function selecionarCampo(campo){

campoAtivo=campo;

document
.querySelectorAll(".field-box")
.forEach(function(el){

el.classList.remove("selected");

});


let box=
document.getElementById(
"box_"+campo
);

if(box){
box.classList.add("selected");
}

}


/* =====================================================
   ATUALIZAR CAMPO
===================================================== */

function atualizarCampo(){

let el=
document.getElementById(
"value_"+campoAtivo
);

if(el){

el.textContent=
dados[campoAtivo];

}

}


/* =====================================================
   TECLADO COMERCIAL
===================================================== */

function commercialKey(tecla){

let atual=
dados[campoAtivo];


/* APAGAR */

if(tecla==="back"){

if(atual.length<=1){

dados[campoAtivo]="0";

}else{

dados[campoAtivo]=
atual.slice(0,-1);

}

atualizarCampo();

calcularComercial();

return;

}


/* AC */

if(tecla==="AC"){

dados[campoAtivo]="0";

atualizarCampo();

calcularComercial();

return;

}


/* VÍRGULA */

if(tecla===","){

if(!atual.includes(",")){

dados[campoAtivo]=
atual+",";
}

atualizarCampo();

return;

}


/* 00 */

if(tecla==="00"){

if(atual==="0"){

dados[campoAtivo]="00";

}else{

dados[campoAtivo]+="00";

}

atualizarCampo();

calcularComercial();

return;

}


/* NÚMEROS */

if(
atual==="0" &&
tecla!=="0"
){

dados[campoAtivo]="";

}


dados[campoAtivo]+=
tecla;


atualizarCampo();

calcularComercial();

}


/* =====================================================
   CÁLCULOS COMERCIAIS
===================================================== */

function calcularComercial(){

let resultado=0;
let detalhe1=0;
let detalhe2=0;


/* ---------------- MARGEM ----------------

Aqui o percentual é SOMADO AO CUSTO.

Exemplo:

100 + 35% = 135

150 + 120% = 330

Não existe limite de 100%.
*/

if(modo==="margem"){

let custo=
numero(dados.custo);

let margem=
numero(dados.margem);

resultado=
custo+
(custo*margem/100);

detalhe1=
resultado-custo;

detalhe2=
margem;

}


/* ---------------- PREÇO ---------------- */

if(modo==="preco"){

let custo=
numero(dados.custo);

let preco=
numero(dados.preco);

resultado=
preco;

detalhe1=
preco-custo;

detalhe2=
preco>0
?
((preco-custo)/preco)*100
:
0;

}


/* ---------------- DESCONTO ---------------- */

if(modo==="desconto"){

let tabela=
numero(dados.tabela);

let desconto=
numero(dados.desconto);

resultado=
tabela-
(tabela*desconto/100);

detalhe1=
tabela-resultado;

detalhe2=
desconto;

}


/* ---------------- MARKUP ---------------- */

if(modo==="markup"){

let custo=
numero(dados.custo);

let markup=
numero(dados.markup);

resultado=
custo*markup;

detalhe1=
resultado-custo;

detalhe2=
resultado>0
?
((resultado-custo)/resultado)*100
:
0;

}


/* RESULTADO */

document.getElementById(
"resultTitle"
).textContent=
modos[modo].titulo;


document.getElementById(
"resultNumber"
).textContent=
moeda(resultado);


document.getElementById(
"detail1Title"
).textContent=
modos[modo].d1;


document.getElementById(
"detail1"
).textContent=
moeda(detalhe1);


document.getElementById(
"detail2Title"
).textContent=
modos[modo].d2;


document.getElementById(
"detail2"
).textContent=
percentual(detalhe2);

}


/* =====================================================
   TROCAR ABA
===================================================== */

function ativarTab(botao){

document
.querySelectorAll(".tab")
.forEach(function(tab){

tab.classList.remove("active");

});

if(botao){

botao.classList.add("active");

}

}


function abrirModo(novoModo,botao){

modo=novoModo;

document.getElementById(
"commercial"
).style.display="flex";


document.getElementById(
"calculator"
).style.display="none";


ativarTab(botao);


/*
Cada ferramenta comercial
começa zerada.
*/

if(novoModo==="margem"){

dados.custo="0";
dados.margem="0";

}

if(novoModo==="preco"){

dados.custo="0";
dados.preco="0";

}

if(novoModo==="desconto"){

dados.tabela="0";
dados.desconto="0";

}

if(novoModo==="markup"){

dados.custo="0";
dados.markup="0";

}


montarCampos();

}


/* =====================================================
   CALCULADORA
===================================================== */

let calcDisplay="0";

let calcTokens=[];

let calcNovo=true;

let calcExpressao="";

let calcResultadoFinal=null;


/* =====================================================
   ATUALIZAR VISOR
===================================================== */

function atualizarCalculadora(){

document.getElementById(
"calcValue"
).textContent=
formatarCalc(calcDisplay);


document.getElementById(
"calcExpression"
).textContent=
calcExpressao;

}


function formatarCalc(valor){

if(valor==="Erro"){
return "Erro";
}

let n=parseFloat(valor);

if(!isFinite(n)){
return "Erro";
}

if(valor.endsWith(".") ){

return valor
.replace(".",",");

}

return n.toLocaleString(
"pt-BR",
{
maximumFractionDigits:10
}
);

}


/* =====================================================
   DIGITAR NÚMERO
===================================================== */

function calcNumero(tecla){

if(calcNovo){

calcDisplay=
tecla;

calcNovo=false;

}else{

if(calcDisplay==="0"){

calcDisplay=tecla;

}else{

calcDisplay+=tecla;

}

}

atualizarCalculadora();

}


/* =====================================================
   VÍRGULA
===================================================== */

function calcVirgula(){

if(calcNovo){

calcDisplay="0.";

calcNovo=false;

}else if(
!calcDisplay.includes(".")
){

calcDisplay+=".";

}

atualizarCalculadora();

}


/* =====================================================
   OPERADOR
===================================================== */

function calcOperador(op){

let valor=parseFloat(calcDisplay);

if(!isFinite(valor)){
return;
}


/*
Se já existe número anterior,
guarda a operação.
*/

if(
calcTokens.length===0
){

calcTokens.push(valor);

}else if(
typeof calcTokens[calcTokens.length-1]
==="number"
){

calcTokens.push(valor);

}


/*
Operador no array
*/

calcTokens.push(op);

calcExpressao=
montarExpressao(
calcTokens
);

calcNovo=true;

atualizarCalculadora();

}


/* =====================================================
   EXPRESSÃO
===================================================== */

function simbolo(op){

if(op==="/")return "÷";
if(op==="*")return "×";
if(op==="-")return "−";
if(op==="+")return "+";

return op;

}


function montarExpressao(tokens){

return tokens
.map(function(item){

if(typeof item==="number"){

return Number(item)
.toLocaleString(
"pt-BR",
{
maximumFractionDigits:10
}
);

}

return simbolo(item);

})
.join(" ");

}


/* =====================================================
   PRECEDÊNCIA MATEMÁTICA
===================================================== */

function resolverTokens(tokens){

let arr=tokens.slice();


/*
Primeiro × e ÷
*/

for(
let i=1;
i<arr.length-1;
i+=2
){

if(
arr[i]==="*" ||
arr[i]==="/"
){

let a=
Number(arr[i-1]);

let b=
Number(arr[i+1]);

let r;

if(arr[i]==="*"){

r=a*b;

}else{

if(b===0){
return NaN;
}

r=a/b;

}

arr.splice(
i-1,
3,
r
);

i-=2;

}

}


/*
Depois + e -
*/

let resultado=
Number(arr[0]);


for(
let i=1;
i<arr.length;
i+=2
){

let op=arr[i];

let n=
Number(arr[i+1]);


if(op==="+"){
resultado+=n;
}

if(op==="-"){
resultado-=n;
}

}

return resultado;

}


/* =====================================================
   IGUAL
===================================================== */

function calcIgual(){

let atual=
parseFloat(calcDisplay);


if(
isFinite(atual) &&
(
calcTokens.length===0 ||
typeof calcTokens[
calcTokens.length-1
]!=="number"
)
){

calcTokens.push(atual);

}


if(calcTokens.length<3){

return;

}


let expressao=
montarExpressao(calcTokens);


let resultado=
resolverTokens(calcTokens);


if(!isFinite(resultado)){

calcDisplay="Erro";

calcExpressao=
expressao+" =";

calcTokens=[];

calcNovo=true;

atualizarCalculadora();

return;

}


calcExpressao=
expressao+" =";


calcDisplay=
String(resultado);

calcResultadoFinal=
resultado;

calcTokens=[];

calcNovo=true;

atualizarCalculadora();

}


/* =====================================================
   PORCENTAGEM
===================================================== */

function calcPorcentagem(){

let atual=
parseFloat(calcDisplay);


if(!isFinite(atual)){
return;
}


/*
Se houver operação anterior,
usa a porcentagem do primeiro valor.

Exemplo:

200 + 10% = 220

200 - 10% = 180

*/

if(
calcTokens.length>=2
){

let ultimo=
calcTokens[
calcTokens.length-1
];

let anterior=
calcTokens[
calcTokens.length-2
];


if(
typeof ultimo==="string" &&
typeof anterior==="number"
){

calcDisplay=
String(
anterior*atual/100
);

atualizarCalculadora();

return;

}

}


calcDisplay=
String(atual/100);

atualizarCalculadora();

}


/* =====================================================
   SINAL
===================================================== */

function calcSinal(){

if(calcDisplay==="0"){
return;
}

if(calcDisplay.startsWith("-")){

calcDisplay=
calcDisplay.substring(1);

}else{

calcDisplay=
"-"+calcDisplay;

}

atualizarCalculadora();

}


/* =====================================================
   APAGAR
===================================================== */

function calcApagar(){

if(calcNovo){

return;

}

if(
calcDisplay.length<=1
){

calcDisplay="0";

}else{

calcDisplay=
calcDisplay.slice(0,-1);

}

atualizarCalculadora();

}


/* =====================================================
   AC
===================================================== */

function calcAC(){

calcDisplay="0";

calcTokens=[];

calcNovo=true;

calcExpressao="";

calcResultadoFinal=null;

atualizarCalculadora();

}


/* =====================================================
   AÇÃO DA CALCULADORA
===================================================== */

function calcAction(acao){

if(
acao>="0" &&
acao<="9"
){

calcNumero(acao);

return;

}


if(acao==="."){

calcVirgula();

return;

}


if(
acao==="+" ||
acao==="-" ||
acao==="*" ||
acao==="/"
){

calcOperador(acao);

return;

}


if(acao==="%"){

calcPorcentagem();

return;

}


if(acao==="sign"){

calcSinal();

return;

}


if(acao==="back"){

calcApagar();

return;

}


if(acao==="AC"){

calcAC();

return;

}


if(acao==="="){

calcIgual();

return;

}

}
