<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>SIENA MARGEM</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
-webkit-touch-callout:none;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
overscroll-behavior:none;
touch-action:manipulation;
background:#030604;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

body{
height:100dvh;
user-select:none;
}

button{
font-family:inherit;
-webkit-appearance:none;
appearance:none;
}

.app{
width:100%;
height:100dvh;
max-width:500px;
margin:auto;

padding:
calc(env(safe-area-inset-top) + 8px)
14px
calc(env(safe-area-inset-bottom) + 8px);

display:flex;
flex-direction:column;

background:
radial-gradient(circle at 50% -8%,#1a4725 0%,#0a190e 28%,#030604 72%);
}

/* TOPO */

.top{
height:15%;
min-height:92px;

display:grid;
grid-template-columns:48px 1fr 48px;
align-items:center;
}

.topButton{
width:43px;
height:43px;

border-radius:14px;
border:1px solid #315b34;

background:
linear-gradient(145deg,#101d13,#060b08);

color:#fff;
font-size:20px;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.05),
0 7px 18px rgba(0,0,0,.25);
}

.brand{
text-align:center;
line-height:1;
}

.brandSiena{
font-size:clamp(42px,11vw,60px);
font-weight:1000;
letter-spacing:-2px;

color:#fff;

text-shadow:
0 0 25px rgba(255,255,255,.08);
}

.brandMargem{
font-size:clamp(18px,5vw,26px);
font-weight:900;
letter-spacing:7px;

color:#58e51e;

margin-top:7px;

text-shadow:
0 0 16px rgba(88,229,30,.2);
}

.brandSub{
font-size:8px;
font-weight:800;
letter-spacing:3px;

color:#818b84;

margin-top:7px;
}

/* ABAS */

.tabs{
height:8%;
min-height:43px;

display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;

margin-bottom:7px;
}

.tab{
border:1px solid #293b2d;
border-radius:12px;

background:
linear-gradient(145deg,#101b13,#070d09);

color:#8e9891;

font-size:9px;
font-weight:900;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.03),
0 5px 12px rgba(0,0,0,.18);
}

.tab.active{
background:
linear-gradient(145deg,#6bf02a,#43bd11);

color:#061006;

border-color:#69e92a;

box-shadow:
0 0 18px rgba(88,229,30,.2),
inset 0 1px 0 rgba(255,255,255,.25);
}

.tab:active{
transform:scale(.97);
}

/* CAMPOS */

.fields{
height:24%;
min-height:145px;

padding:10px;

display:flex;
flex-direction:column;
justify-content:center;
gap:8px;

border-radius:19px;

border:1px solid #293b2d;

background:
linear-gradient(145deg,rgba(17,31,20,.96),rgba(5,11,7,.98));

box-shadow:
inset 0 1px 0 rgba(255,255,255,.035),
0 12px 30px rgba(0,0,0,.25);
}

.field{
flex:1;
min-height:0;
}

.label{
display:block;

font-size:8px;
font-weight:900;
letter-spacing:1px;

color:#9fa9a2;

margin-bottom:4px;
}

.display{
height:calc(100% - 13px);
min-height:39px;

display:flex;
align-items:center;

border-radius:12px;

border:1px solid #2a3c2e;

background:
linear-gradient(145deg,#050a06,#020503);

box-shadow:
inset 0 2px 8px rgba(0,0,0,.4);

transition:.15s;
}

.display.selected{
border-color:#58e51e;

box-shadow:
0 0 0 1px rgba(88,229,30,.25),
0 0 18px rgba(88,229,30,.12),
inset 0 2px 8px rgba(0,0,0,.4);
}

.prefix{
padding-left:11px;
padding-right:6px;

color:#58e51e;

font-size:16px;
font-weight:900;
}

.value{
flex:1;

font-size:18px;
font-weight:900;

color:#fff;

padding:0 6px;

overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.suffix{
padding:0 11px;

color:#58e51e;

font-size:16px;
font-weight:900;
}

/* RESULTADO */

.result{
height:17%;
min-height:98px;

margin-top:7px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

border-radius:19px;

border:1px solid #4b9630;

background:
radial-gradient(
circle at 80% 0%,
rgba(88,229,30,.18),
transparent 46%
),
linear-gradient(145deg,#0b1a0d,#050c07);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.04),
0 12px 30px rgba(0,0,0,.25);
}

.resultLabel{
font-size:8px;
font-weight:900;
letter-spacing:1.5px;

color:#9ca69f;
}

.resultValue{
font-size:clamp(31px,9vw,46px);

font-weight:1000;

line-height:1;

color:#58e51e;

margin:5px 0 8px;

text-shadow:
0 0 20px rgba(88,229,30,.18);
}

.resultInfo{
width:85%;

display:grid;
grid-template-columns:1fr 1fr;

border-top:1px solid #293a2d;

padding-top:6px;

text-align:center;
}

.resultInfo div:first-child{
border-right:1px solid #293a2d;
}

.resultInfo small{
display:block;

font-size:7px;

color:#7d877f;

margin-bottom:2px;
}

.resultInfo strong{
font-size:13px;
}

/* AÇÕES */

.actions{
height:7%;
min-height:39px;

display:grid;
grid-template-columns:1.55fr 1fr;

gap:7px;

margin-top:7px;
}

.action{
border-radius:12px;

border:1px solid #2c402f;

background:
linear-gradient(145deg,#121e15,#070d09);

color:#fff;

font-size:11px;
font-weight:900;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.03),
0 6px 15px rgba(0,0,0,.18);
}

.action.calculate{
background:
linear-gradient(145deg,#69ed28,#3bb50d);

border-color:#62df24;

color:#061006;

box-shadow:
0 7px 18px rgba(73,201,17,.18);
}

.action:active{
transform:scale(.97);
}

/* TECLADO */

.keypad{
height:27%;

min-height:145px;

display:grid;

grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);

gap:6px;

margin-top:7px;
}

.key{
border-radius:13px;

border:1px solid #293b2d;

background:
linear-gradient(145deg,#17221a,#090f0b);

color:#fff;

font-size:19px;
font-weight:900;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.035),
0 6px 13px rgba(0,0,0,.22);
}

.key:active{
transform:scale(.94);

background:
linear-gradient(145deg,#202d23,#0c140e);
}

.key.green{
color:#58e51e;
}

.key.equal{
background:
linear-gradient(145deg,#69ed28,#3bb50d);

color:#061006;

border-color:#63df25;

font-size:27px;

box-shadow:
0 0 18px rgba(88,229,30,.15),
inset 0 1px 0 rgba(255,255,255,.2);
}

.key.equal:active{
transform:scale(.94);
}

/* RODAPÉ */

.footer{
height:3%;

min-height:18px;

display:flex;
align-items:center;
justify-content:center;

font-size:8px;

color:#626d65;
}

.footer span{
color:#8d9890;
font-weight:bold;

margin-left:3px;
}

/* MENU */

.overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,.76);

display:none;

z-index:50;
}

.overlay.show{
display:block;
}

.menu{
position:fixed;

z-index:60;

top:0;
left:-310px;

width:290px;
height:100dvh;

padding:
calc(env(safe-area-inset-top) + 25px)
18px;

background:
linear-gradient(160deg,#0a160d,#050a06);

border-right:1px solid #29432d;

transition:.25s;

box-shadow:
15px 0 40px rgba(0,0,0,.35);
}

.menu.show{
left:0;
}

.menuLogo{
font-size:27px;
font-weight:1000;
}

.menuLogo span{
color:#58e51e;
}

.menuSub{
font-size:8px;
letter-spacing:2px;

color:#778078;

margin:5px 0 24px;
}

.menuButton{
width:100%;

padding:15px;

margin-bottom:9px;

border-radius:13px;

border:1px solid #263a2b;

background:
linear-gradient(145deg,#111d14,#080e0a);

color:#fff;

text-align:left;

font-size:13px;
font-weight:bold;
}

.menuButton:active{
transform:scale(.98);
}

/* MODAL */

.modal{
position:fixed;

inset:0;

z-index:100;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:rgba(0,0,0,.82);
}

.modal.show{
display:flex;
}

.modalBox{
width:100%;
max-width:430px;

max-height:80dvh;

overflow:auto;

padding:20px;

border-radius:19px;

border:1px solid #29432d;

background:
linear-gradient(145deg,#0b170e,#050a06);

box-shadow:
0 25px 70px rgba(0,0,0,.55);
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

.modalHead h2{
margin:0;

font-size:19px;
}

.close{
border:0;

background:none;

color:#fff;

font-size:26px;
}

.info{
padding:14px;

margin-bottom:9px;

border-radius:13px;

border:1px solid #26372a;

background:#0d1810;
}

.info strong{
color:#58e51e;
}

.info p{
font-size:12px;

line-height:1.5;

color:#a2aaa4;
}

/* TELAS BAIXAS */

@media(max-height:700px){

height:14%;
min-height:82px;
}

.brandSiena{
font-size:40px;
}

.brandMargem{
font-size:17px;
margin-top:4px;
}

.brandSub{
font-size:7px;
margin-top:5px;
}

.fields{
height:23%;
min-height:135px;

padding:8px;

gap:5px;
}

.display{
min-height:36px;
}

.result{
height:17%;
min-height:88px;
}

.resultValue{
font-size:29px;
}

.actions{
height:7%;
}

.keypad{
height:29%;
min-height:140px;

gap:5px;
}

}

.footer{
display:none;
}

}

/* TELAS MUITO BAIXAS */

@media(max-height:620px){

.brandSiena{

}

.brandMargem{
font-size:14px;
letter-spacing:5px;
}

.topButton{
width:37px;
height:37px;
font-size:18px;
}

.tabs{
min-height:38px;
}

.tab{
font-size:8px;
}

.fields{
height:22%;
}

height:16%;
}

.keypad{
height:31%;
}

}

/* ANDROID/IOS */

@supports(height:100svh){

.app{
height:100svh;
}

}

</style>

</head>

<body>


<div class="app">

<script>

/* =========================
ESTADO
========================= */

let modo="margem";

let campoAtivo=null;

let valores={
custo:"0",
margem:"0",
preco:"0",
precoTabela:"0",
desconto:"0",
markup:"0"
};


/* =========================
CONFIGURAÇÕES
========================= */

const modos={

margem:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["margem","MARGEM DESEJADA","%"]
],

resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
},

preco:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["preco","PREÇO DE VENDA","R$"]
],

resultado:"MARGEM OBTIDA",
info1:"LUCRO",
info2:"MARKUP"
},

desconto:{
campos:[
["precoTabela","PREÇO DE TABELA","R$"],
["desconto","DESCONTO","%"]
],

resultado:"PREÇO FINAL",
info1:"ECONOMIA",
info2:"DESCONTO"
},

markup:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["markup","MARKUP","x"]
],

resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
}

};


/* =========================
MONTA CAMPOS
========================= */

function montarCampos(){

let config=modos[modo];

let html="";

config.campos.forEach(c=>{

html+=`

<div class="field">

<label class="label">
${c[1]}
</label>

<div
class="display"
id="display_${c[0]}"
onclick="selecionarCampo('${c[0]}')">

<span class="prefix">
${c[2]}
</span>

<span
class="value"
id="value_${c[0]}">
${valores[c[0]]}
</span>

</div>

</div>

`;

});

document.getElementById("fields").innerHTML=html;

campoAtivo=config.campos[0][0];

atualizarSelecao();

calcular();

}


/* =========================
SELECIONAR CAMPO
========================= */

function selecionarCampo(nome){

campoAtivo=nome;

atualizarSelecao();

}


/* =========================
DESTAQUE DO CAMPO
========================= */

function atualizarSelecao(){

document
.querySelectorAll(".display")
.forEach(x=>
x.classList.remove("selected")
);

let elemento=
document.getElementById(
"display_"+campoAtivo
);

if(elemento){

elemento.classList.add("selected");

}

}


/* =========================
NÚMERO
========================= */

function numero(v){

return parseFloat(
String(v||"")
.replace(/\./g,"")
.replace(",",".")
) || 0;

}


/* =========================
MOEDA
========================= */

function moeda(v){

return v.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =========================
ATUALIZA DISPLAY
========================= */

function atualizarDisplay(){

let config=modos[modo];

config.campos.forEach(c=>{

let elemento=
document.getElementById(
"value_"+c[0]
);

if(elemento){

elemento.textContent=
valores[c[0]];

}

});

}


/* =========================
CALCULAR
========================= */

function calcular(){

let resultado=0;

let info1=0;

let info2=0;


/* MARGEM */

if(modo==="margem"){

let custo=
numero(valores.custo);

let margem=
numero(valores.margem);


/*
A margem é aplicada
sobre o custo.

100 + 30% = 130
100 + 150% = 250
100 + 500% = 600

Sem limite.
*/

resultado=
custo+(custo*margem/100);

info1=
resultado-custo;

info2=
margem;

}


/* PREÇO */

if(modo==="preco"){

let custo=
numero(valores.custo);

let preco=
numero(valores.preco);

if(custo>0 && preco>0){

resultado=
((preco-custo)/preco)*100;

info1=
preco-custo;

info2=
preco/custo;

}

}


/* DESCONTO */

if(modo==="desconto"){

let tabela=
numero(valores.precoTabela);

let desconto=
numero(valores.desconto);

resultado=
tabela-(tabela*desconto/100);

info1=
tabela-resultado;

info2=
desconto;

}


/* MARKUP */

if(modo==="markup"){

let custo=
numero(valores.custo);

let markup=
numero(valores.markup);

resultado=
custo*markup;

info1=
resultado-custo;

if(resultado>0){

info2=
((resultado-custo)/resultado)*100;

}

}


/* RESULTADO */

if(modo==="preco"){

document.getElementById("resultValue")
.textContent=
resultado.toFixed(2)
.replace(".",",")+"%";

document.getElementById("info1")
.textContent=
moeda(info1);

document.getElementById("info2")
.textContent=
info2.toFixed(2)
.replace(".",",")+"x";

}

else{

document.getElementById("resultValue")
.textContent=
moeda(resultado);

document.getElementById("info1")
.textContent=
moeda(info1);

document.getElementById("info2")
.textContent=
info2.toFixed(2)
.replace(".",",")+"%";

}


let config=modos[modo];

document.getElementById("resultLabel")
.textContent=
config.resultado;

document.getElementById("info1Label")
.textContent=
config.info1;

document.getElementById("info2Label")
.textContent=
config.info2;

}


/* =========================
DIGITAR
========================= */

function digitar(valor){

if(!campoAtivo){

campoAtivo=
modos[modo].campos[0][0];

}


/* ZERO INICIAL */

if(
valores[campoAtivo]==="0" &&
valor!==","
){

valores[campoAtivo]="";

}


/* VÍRGULA */

if(
valor==="," &&
valores[campoAtivo].includes(",")
){

return;

}


/* EVITA MAIS DE UMA VÍRGULA */

valores[campoAtivo]+=valor;

atualizarDisplay();

calcular();

}


/* =========================
APAGAR
========================= */

function apagar(){

if(!campoAtivo)return;

valores[campoAtivo]=
valores[campoAtivo].slice(0,-1);

if(
valores[campoAtivo]===""
){

valores[campoAtivo]="0";

}

atualizarDisplay();

calcular();

}


/* =========================
LIMPAR CAMPO
========================= */

function limparCampo(){

if(!campoAtivo)return;

valores[campoAtivo]="0";

atualizarDisplay();

calcular();

}


/* =========================
LIMPAR TUDO
========================= */

function limpar(){

Object.keys(valores)
.forEach(chave=>{
valores[chave]="0";
});

atualizarDisplay();

calcular();

}


/* =========================
TROCAR MODO
========================= */

function trocarModo(novo,botao){

modo=novo;


/*
Cada aba começa sempre zerada.
*/

modos[modo].campos.forEach(c=>{
valores[c[0]]="0";
});


document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

botao.classList.add("active");

montarCampos();

}

/* =========================
BLOQUEAR ZOOM
========================= */

document.addEventListener(
"gesturestart",
function(e){
e.preventDefault();
},
{passive:false}
);

document.addEventListener(
"gesturechange",
function(e){
e.preventDefault();
},
{passive:false}
);

document.addEventListener(
"gestureend",
function(e){
e.preventDefault();
},
{passive:false}
);


/*
Bloqueia double tap zoom,
mas mantém os botões funcionando.
*/

let ultimoToque=0;

document.addEventListener(
"touchend",
function(e){

let agora=Date.now();

if(agora-ultimoToque<=300){

e.preventDefault();

}

ultimoToque=agora;

},
{passive:false}
);

========================= */

montarCampos();
