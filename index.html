<script>

/* =====================================================
   DADOS COMERCIAIS
===================================================== */

let modo="margem";

let campoAtivo=null;

let valores={
custo:"0",
margem:"0",
preco:"0",
precoTabela:"0",
desconto:"0",
markup:"0"
};


/* =====================================================
   MODOS
===================================================== */

const modos={

margem:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["margem","MARGEM DESEJADA","%"]
],
resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
},

preco:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["preco","PREÇO DE VENDA","R$"]
],
resultado:"MARGEM OBTIDA",
info1:"LUCRO",
info2:"MARKUP"
},

desconto:{
campos:[
["precoTabela","PREÇO DE TABELA","R$"],
["desconto","DESCONTO","%"]
],
resultado:"PREÇO FINAL",
info1:"ECONOMIA",
info2:"DESCONTO"
},

markup:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["markup","MARKUP","x"]
],
resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
}

};


/* =====================================================
   CAMPOS
===================================================== */

function montarCampos(){

let config=modos[modo];

let html="";

config.campos.forEach(c=>{

html+=`

<div class="field">

<label class="label">
${c[1]}
</label>

<div
class="display"
id="display_${c[0]}"
onclick="selecionarCampo('${c[0]}')">

<span class="prefix">
${c[2]}
</span>

<span
class="value"
id="value_${c[0]}">
${valores[c[0]]}
</span>

</div>

</div>

`;

});

document.getElementById("fields").innerHTML=html;

campoAtivo=config.campos[0][0];

atualizarSelecao();

calcular();

}


function selecionarCampo(nome){

campoAtivo=nome;

atualizarSelecao();

}


function atualizarSelecao(){

document
.querySelectorAll(".display")
.forEach(x=>{
x.classList.remove("selected");
});

let el=
document.getElementById(
"display_"+campoAtivo
);

if(el){
el.classList.add("selected");
}

}


/* =====================================================
   NÚMEROS
===================================================== */

function numero(v){

return parseFloat(
String(v||"")
.replace(/\./g,"")
.replace(",",".")
) || 0;

}


function moeda(v){

return v.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =====================================================
   DISPLAY
===================================================== */

function atualizarDisplay(){

let config=modos[modo];

config.campos.forEach(c=>{

let el=
document.getElementById(
"value_"+c[0]
);

if(el){
el.textContent=
valores[c[0]];
}

});

}


/* =====================================================
   DIGITAR
===================================================== */

function digitar(valor){

if(!campoAtivo){

campoAtivo=
modos[modo].campos[0][0];

}

if(
valores[campoAtivo]==="0" &&
valor!==","
){

valores[campoAtivo]="";

}

if(
valor==="," &&
valores[campoAtivo].includes(",")
){

return;

}

valores[campoAtivo]+=valor;

atualizarDisplay();

calcular();

}


/* =====================================================
   APAGAR
===================================================== */

function apagar(){

if(!campoAtivo)return;

valores[campoAtivo]=
valores[campoAtivo].slice(0,-1);

if(
valores[campoAtivo]===""
){

valores[campoAtivo]="0";

}

atualizarDisplay();

calcular();

}


/* =====================================================
   LIMPAR
===================================================== */

function limparCampo(){

if(!campoAtivo)return;

valores[campoAtivo]="0";

atualizarDisplay();

calcular();

}


function limpar(){

Object.keys(valores).forEach(k=>{
valores[k]="0";
});

atualizarDisplay();

calcular();

}


/* =====================================================
   CÁLCULO COMERCIAL
===================================================== */

function calcular(){

let resultado=0;
let info1=0;
let info2=0;


/* MARGEM */

if(modo==="margem"){

let custo=numero(valores.custo);
let margem=numero(valores.margem);

/*
ACRÉSCIMO SOBRE O CUSTO.

100 + 30% = 130
100 + 150% = 250
100 + 500% = 600

SEM LIMITE.
*/

resultado=
custo+(custo*margem/100);

info1=
resultado-custo;

info2=
margem;

}


/* PREÇO */

if(modo==="preco"){

let custo=numero(valores.custo);
let preco=numero(valores.preco);

if(custo>0){

resultado=
((preco-custo)/preco)*100;

info1=
preco-custo;

info2=
preco/custo;

}

}


/* DESCONTO */

if(modo==="desconto"){

let tabela=
numero(valores.precoTabela);

let desconto=
numero(valores.desconto);

resultado=
tabela-(tabela*desconto/100);

info1=
tabela-resultado;

info2=
desconto;

}


/* MARKUP */

if(modo==="markup"){

let custo=
numero(valores.custo);

let markup=
numero(valores.markup);

resultado=
custo*markup;

info1=
resultado-custo;

if(resultado>0){

info2=
((resultado-custo)/resultado)*100;

}

}


/* MOSTRAR */

if(modo==="preco"){

document.getElementById("resultValue")
.textContent=
resultado.toFixed(2)
.replace(".",",")+"%";

}else{

document.getElementById("resultValue")
.textContent=
moeda(resultado);

}

document.getElementById("info1")
.textContent=
moeda(info1);

document.getElementById("info2")
.textContent=
info2.toFixed(2)
.replace(".",",")+"%";


let config=modos[modo];

document.getElementById("resultLabel")
.textContent=config.resultado;

document.getElementById("info1Label")
.textContent=config.info1;

document.getElementById("info2Label")
.textContent=config.info2;

}

/* =====================================================
   CALCULADORA LIVRE
===================================================== */

let calcExpression="";
let calcCurrent="0";
let calcLastWasEqual=false;

/* =====================================================
   DISPLAY CALCULADORA
===================================================== */

function atualizarCalcDisplay(){

document.getElementById(
"calcExpression"
).textContent=
formatarExpressao(calcExpression);

document.getElementById(
"calcResult"
).textContent=
formatarNumeroCalc(calcCurrent);

}


function formatarExpressao(expr){

return expr
.replace(/\*/g," × ")
.replace(/\//g," ÷ ")
.replace(/\+/g," + ")
.replace(/-/g," − ");

}


function formatarNumeroCalc(valor){

if(valor==="Erro"){
return "Erro";
}

if(valor.includes(".")){

let partes=valor.split(".");

let inteiro=
Number(partes[0])
.toLocaleString("pt-BR");

return inteiro+","+partes[1];

}

let n=Number(valor);

if(!isFinite(n)){
return "Erro";
}

return n.toLocaleString("pt-BR");

}


/* =====================================================
   NÚMEROS
===================================================== */

function calcDigit(d){

if(calcLastWasEqual){

calcExpression="";
calcCurrent="0";
calcLastWasEqual=false;

}

if(calcCurrent==="0"){

calcCurrent=d;

}else{

calcCurrent+=d;

}

atualizarCalcDisplay();

}


/* =====================================================
   VÍRGULA
===================================================== */

function calcDecimal(){

if(calcLastWasEqual){

calcExpression="";
calcCurrent="0";
calcLastWasEqual=false;

}

if(
!calcCurrent.includes(".")
){

calcCurrent+=".";

}

atualizarCalcDisplay();

}


/* =====================================================
   OPERADORES
===================================================== */

function calcOperator(op){

if(calcCurrent==="Erro"){

calcClear();

}

if(calcExpression===""){

calcExpression=
calcCurrent+op;

}else{

if(
/[+\-*/]$/.test(calcExpression)
){

calcExpression=
calcExpression.slice(0,-1)+op;

}else{

calcExpression+=
calcCurrent+op;

}

}

calcCurrent="0";

calcLastWasEqual=false;

atualizarCalcDisplay();

}


/* =====================================================
   PORCENTAGEM
===================================================== */

function calcPercent(){

let valor=
Number(calcCurrent);

if(isNaN(valor))return;

calcCurrent=
String(valor/100);

atualizarCalcDisplay();

}


/* =====================================================
   APAGAR
===================================================== */

function calcBackspace(){

if(calcLastWasEqual){
return;
}

if(calcCurrent.length<=1){

calcCurrent="0";

}else{

calcCurrent=
calcCurrent.slice(0,-1);

}

atualizarCalcDisplay();

}


/* =====================================================
   AC
===================================================== */

function calcClear(){

calcExpression="";
calcCurrent="0";
calcLastWasEqual=false;

atualizarCalcDisplay();

}


/* =====================================================
   IGUAL
===================================================== */

function calcEquals(){

if(
calcExpression==="" ||
calcCurrent==="Erro"
){

return;

}

let expressaoFinal=
calcExpression+
calcCurrent;

let resultado;

try{

/*
Permite somente:
números
ponto
+
-
*
/
espaços
*/

if(
!/^[0-9+\-*/. ]+$/.test(
expressaoFinal
)
){

throw new Error();

}


/*
Não aceita expressão terminando
em operador.
*/

if(
/[+\-*/.]$/.test(
expressaoFinal
)
){

throw new Error();

}


/*
Executa somente expressão matemática
validada acima.
*/

resultado=
Function(
'"use strict";return ('+
expressaoFinal+
')'
)();


if(
typeof resultado!=="number" ||
!isFinite(resultado)
){

throw new Error();

}

}catch(e){

calcExpression=
expressaoFinal;

calcCurrent="Erro";

calcLastWasEqual=true;

atualizarCalcDisplay();

return;

}


/*
Mantém a conta inteira visível.
*/

calcExpression=
expressaoFinal+" =";

calcCurrent=
String(
Number(
resultado.toFixed(10)
)
);

calcLastWasEqual=true;

atualizarCalcDisplay();

}
