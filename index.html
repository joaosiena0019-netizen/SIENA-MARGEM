<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SIENA MARGEM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030604;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:manipulation;
  overscroll-behavior:none;
}

button{
  font-family:Arial,Helvetica,sans-serif;
  border:0;
  outline:0;
}

.app{
  width:100%;
  height:100dvh;
  max-width:520px;
  margin:auto;
  padding:
    calc(env(safe-area-inset-top) + 6px)
    12px
    calc(env(safe-area-inset-bottom) + 6px);

  display:flex;
  flex-direction:column;

  background:
    radial-gradient(circle at 50% -10%,#16451f 0%,#09170c 28%,#030604 70%);
}

/* TOPO */

.top{
  height:13%;
  min-height:70px;
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:13px;
  border:1px solid #315a34;
  background:#0a120c;
  color:#fff;
  font-size:19px;
}

.brand{
  text-align:center;
  line-height:1;
}

.siena{
  font-size:clamp(38px,10vw,56px);
  font-weight:1000;
  letter-spacing:-2px;
}

.margem{
  margin-top:6px;
  font-size:clamp(16px,4.5vw,23px);
  font-weight:900;
  letter-spacing:6px;
  color:#59e51f;
}

.sub{
  margin-top:6px;
  font-size:7px;
  letter-spacing:3px;
  color:#7d897f;
  font-weight:bold;
}

/* ABAS */

.tabs{
  height:8%;
  min-height:42px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-bottom:6px;
}

.tab{
  border-radius:11px;
  border:1px solid #293b2d;
  background:#0b130d;
  color:#89928b;
  font-size:8px;
  font-weight:900;
}

.tab.active{
  background:#59e51f;
  color:#061006;
  border-color:#59e51f;
}

/* ÁREA PRINCIPAL */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* CAMPOS */

.fields{
  height:22%;
  min-height:95px;

  display:flex;
  flex-direction:column;
  gap:6px;

  padding:8px;

  border:1px solid #293d2d;
  border-radius:17px;

  background:#071009;
}

.field{
  flex:1;
  min-height:0;
}

.label{
  display:block;
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
  color:#98a39b;
  margin-bottom:3px;
}

.display{
  height:calc(100% - 11px);
  min-height:32px;

  display:flex;
  align-items:center;

  border:1px solid #293b2d;
  border-radius:11px;

  background:#030704;
}

.display.selected{
  border-color:#59e51f;
  box-shadow:0 0 0 1px rgba(89,229,31,.2);
}

.prefix,.suffix{
  color:#59e51f;
  font-weight:900;
  font-size:14px;
}

.prefix{
  padding-left:10px;
  padding-right:6px;
}

.suffix{
  padding-right:10px;
}

.value{
  flex:1;
  font-size:16px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* RESULTADO */

.result{
  height:21%;
  min-height:90px;

  margin-top:6px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  border:1px solid #43852e;
  border-radius:17px;

  background:#071109;
}

.resultLabel{
  font-size:8px;
  font-weight:900;
  letter-spacing:1.4px;
  color:#9ba59e;
}

.resultValue{
  margin:5px 0 7px;
  font-size:clamp(28px,8vw,43px);
  line-height:1;
  font-weight:1000;
  color:#59e51f;
}

.resultInfo{
  width:84%;
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid #293a2d;
  padding-top:5px;
  text-align:center;
}

.resultInfo>div:first-child{
  border-right:1px solid #293a2d;
}

.resultInfo small{
  display:block;
  font-size:6px;
  color:#7d877f;
}

.resultInfo strong{
  font-size:11px;
}

/* TECLADO */

.keypad{
  height:48%;
  min-height:190px;

  display:grid;

  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);

  gap:5px;

  margin-top:6px;
}

.key{
  border-radius:13px;
  border:1px solid #2b412f;

  background:#111b14;

  color:#fff;

  font-size:20px;
  font-weight:800;
}

.key:active{
  transform:scale(.94);
  background:#1d2c20;
}

.key.special{
  color:#59e51f;
  background:#0c160e;
}

.key.equal{
  background:#59e51f;
  color:#061006;
  border-color:#59e51f;
  font-size:27px;
}

.key.zero{
  grid-column:span 2;
}

/* CALCULADORA LIVRE */

.calc{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.calcScreen{
  height:25%;
  min-height:105px;

  padding:12px 15px;

  border:1px solid #304633;
  border-radius:17px;

  background:#050b07;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;

  overflow:hidden;
}

.expression{
  width:100%;
  min-height:22px;

  text-align:right;

  color:#7d897f;

  font-size:14px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  margin-bottom:7px;
}

.calcValue{
  width:100%;

  text-align:right;

  color:#fff;

  font-size:clamp(38px,11vw,58px);
  font-weight:1000;

  line-height:1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MENU */

.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  background:rgba(0,0,0,.75);
}

.overlay.show{
  display:block;
}

.menu{
  position:fixed;
  z-index:60;

  top:0;
  left:-300px;

  width:280px;
  height:100dvh;

  padding:
    calc(env(safe-area-inset-top) + 25px)
    17px;

  background:#071009;

  border-right:1px solid #29432d;

  transition:left .2s;
}

.menu.show{
  left:0;
}

.menuTitle{
  font-size:26px;
  font-weight:1000;
}

.menuTitle span{
  color:#59e51f;
}

.menuButton{
  width:100%;
  padding:15px;
  margin-top:9px;

  border-radius:12px;

  border:1px solid #293b2d;

  background:#0d1810;

  color:#fff;

  text-align:left;
  font-weight:bold;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.8);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  padding:18px;

  border-radius:17px;

  border:1px solid #29432d;

  background:#071009;
}

.modalTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modalTop h2{
  margin:0;
  font-size:18px;
}

.close{
  background:none;
  color:#fff;
  font-size:25px;
}

.info{
  margin-top:12px;
  padding:13px;

  border-radius:12px;

  background:#0d1810;
  border:1px solid #26382a;
}

.info strong{
  color:#59e51f;
}

.info p{
  color:#a0aaa3;
  font-size:12px;
  line-height:1.45;
}

/* TELAS PEQUENAS */

@media(max-height:680px){

  .top{
    min-height:62px;
  }

  .siena{
    font-size:35px;
  }

  .margem{
    font-size:14px;
    margin-top:4px;
  }

  .sub{
    font-size:6px;
    margin-top:4px;
  }

  .tabs{
    min-height:38px;
  }

  .tab{
    font-size:7px;
  }

  .fields{
    height:20%;
    min-height:85px;
  }

  .result{
    height:19%;
    min-height:78px;
  }

  .resultValue{
    font-size:27px;
  }

  .keypad{
    height:50%;
  }

  .key{
    font-size:17px;
  }
}

</style>
</head>

<body>

<div class="app">

<!-- TOPO -->

<div class="top">

<button class="iconBtn" onclick="abrirMenu()">☰</button>

<div class="brand">

<div class="siena">SIENA</div>
<div class="margem">MARGEM</div>
<div class="sub">SIMULADOR COMERCIAL</div>

</div>

<button class="iconBtn" onclick="abrirSobre()">ⓘ</button>

</div>


<!-- ABAS -->

<div class="tabs">

<button class="tab active" onclick="modoComercial('margem',this)">
MARGEM
</button>

<button class="tab" onclick="modoComercial('preco',this)">
PREÇO
</button>

<button class="tab" onclick="modoComercial('desconto',this)">
DESC.
</button>

<button class="tab" onclick="modoComercial('markup',this)">
MARKUP
</button>

<button class="tab" onclick="abrirCalc(this)">
CALC
</button>

</div>


<!-- PRINCIPAL -->

<div class="main">

<!-- COMERCIAL -->

<div id="comercial">

<div class="fields" id="fields"></div>

<div class="result">

<div class="resultLabel" id="resultLabel">
PREÇO DE VENDA
</div>

<div class="resultValue" id="resultValue">
R$ 0,00
</div>

<div class="resultInfo">

<div>
<small id="info1Label">LUCRO</small>
<strong id="info1">R$ 0,00</strong>
</div>

<div>
<small id="info2Label">MARGEM</small>
<strong id="info2">0,00%</strong>
</div>

</div>

</div>

</div>


<!-- CALCULADORA -->

<div id="calc" class="calc" style="display:none">

<div class="calcScreen">

<div class="expression" id="expression"></div>

<div class="calcValue" id="calcValue">
0
</div>

</div>

</div>


<!-- TECLADO ÚNICO -->

<div class="keypad">

<button class="key" onclick="tecla('7')">7</button>
<button class="key" onclick="tecla('8')">8</button>
<button class="key" onclick="tecla('9')">9</button>
<button class="key special" onclick="tecla('BACK')">⌫</button>

<button class="key" onclick="tecla('4')">4</button>
<button class="key" onclick="tecla('5')">5</button>
<button class="key" onclick="tecla('6')">6</button>
<button class="key special" onclick="tecla('00')">00</button>

<button class="key" onclick="tecla('1')">1</button>
<button class="key" onclick="tecla('2')">2</button>
<button class="key" onclick="tecla('3')">3</button>
<button class="key special" onclick="tecla(',')">,</button>

<button class="key zero" onclick="tecla('0')">0</button>
<button class="key special" onclick="tecla('AC')">AC</button>
<button class="key equal" onclick="tecla('=')">=</button>

</div>

</div>


<!-- RODAPÉ -->

<div class="footer">
Criado e desenvolvido por
<span>João Siena</span>
</div>


</div>


<!-- MENU -->

<div id="overlay" class="overlay" onclick="fecharMenu()"></div>

<div id="menu" class="menu">

<div class="menuTitle">
SIENA <span>MARGEM</span>
</div>

<button class="menuButton" onclick="abrirCalc()">
▦ &nbsp; Calculadora
</button>

<button class="menuButton" onclick="abrirInformacoes()">
∑ &nbsp; Informações
</button>

<button class="menuButton" onclick="abrirSobre()">
ⓘ &nbsp; Sobre
</button>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modalBox">

<div class="modalTop">

<h2 id="modalTitle">
SIENA MARGEM
</h2>

<button class="close" onclick="fecharModal()">×</button>

</div>

<div id="modalContent"></div>

</div>

</div>


<script>

/* =====================================================
   ESTADO
===================================================== */

let modo="margem";

let campoAtivo="custo";

let comercialAtivo=true;


/* valores comerciais */

const valores={
  custo:"0",
  margem:"0",
  preco:"0",
  tabela:"0",
  desconto:"0",
  markup:"0"
};


/* =====================================================
   CONFIGURAÇÃO DOS MODOS
===================================================== */

const config={

margem:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["margem","MARGEM DESEJADA","%"]
],
resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
},

preco:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["preco","PREÇO DE VENDA","R$"]
],
resultado:"MARGEM OBTIDA",
info1:"LUCRO",
info2:"MARKUP"
},

desconto:{
campos:[
["tabela","PREÇO DE TABELA","R$"],
["desconto","DESCONTO","%"]
],
resultado:"PREÇO FINAL",
info1:"ECONOMIA",
info2:"DESCONTO"
},

markup:{
campos:[
["custo","CUSTO DO PRODUTO","R$"],
["markup","MARKUP","x"]
],
resultado:"PREÇO DE VENDA",
info1:"LUCRO",
info2:"MARGEM"
}

};


/* =====================================================
   CALCULADORA LIVRE
===================================================== */

let calcTokens=[];

let calcNumero="0";

let calcOperacao=null;

let calcResultado=null;

let calcNovoNumero=false;

let calcExpressao="";


/* =====================================================
   MONTAR CAMPOS
===================================================== */

function montarCampos(){

const c=config[modo];

let html="";

c.campos.forEach(x=>{

html+=`

<div class="field">

<label class="label">
${x[1]}
</label>

<div
class="display"
id="display_${x[0]}"
onclick="selecionarCampo('${x[0]}')">

<span class="prefix">
${x[2]}
</span>

<span
class="value"
id="value_${x[0]}">
${valores[x[0]]}
</span>

</div>

</div>

`;

});

document.getElementById("fields").innerHTML=html;

campoAtivo=c.campos[0][0];

selecionarCampo(campoAtivo);

calcularComercial();

}


/* =====================================================
   SELECIONAR CAMPO
===================================================== */

function selecionarCampo(nome){

campoAtivo=nome;

document
.querySelectorAll(".display")
.forEach(x=>x.classList.remove("selected"));

const el=
document.getElementById(
"display_"+nome
);

if(el){
el.classList.add("selected");
}

}


/* =====================================================
   NÚMERO
===================================================== */

function num(v){

return parseFloat(
String(v)
.replace(/\./g,"")
.replace(",",".")
) || 0;

}


/* =====================================================
   MOEDA
===================================================== */

function moeda(v){

if(!isFinite(v))v=0;

return v.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =====================================================
   ATUALIZAR CAMPO
===================================================== */

function atualizarCampo(){

const el=
document.getElementById(
"value_"+campoAtivo
);

if(el){
el.textContent=
valores[campoAtivo];
}

}


/* =====================================================
   CÁLCULO COMERCIAL
===================================================== */

function calcularComercial(){

let resultado=0;
let lucro=0;
let info2=0;


/* MARGEM */

if(modo==="margem"){

const custo=num(valores.custo);
const margem=num(valores.margem);

resultado=
custo+(custo*margem/100);

lucro=
resultado-custo;

info2=margem;

}


/* PREÇO */

if(modo==="preco"){

const custo=num(valores.custo);
const preco=num(valores.preco);

resultado=
preco;

lucro=
preco-custo;

info2=
custo>0
?
((preco-custo)/preco)*100
:
0;

}


/* DESCONTO */

if(modo==="desconto"){

const tabela=num(valores.tabela);
const desconto=num(valores.desconto);

resultado=
tabela-(tabela*desconto/100);

lucro=
tabela-resultado;

info2=desconto;

}


/* MARKUP */

if(modo==="markup"){

const custo=num(valores.custo);
const markup=num(valores.markup);

resultado=
custo*markup;

lucro=
resultado-custo;

info2=
resultado>0
?
((resultado-custo)/resultado)*100
:
0;

}


/* MOSTRAR */

document.getElementById("resultValue")
.textContent=
moeda(resultado);

document.getElementById("info1")
.textContent=
moeda(lucro);

document.getElementById("info2")
.textContent=
info2.toFixed(2).replace(".",",")+"%";


const c=config[modo];

document.getElementById("resultLabel")
.textContent=c.resultado;

document.getElementById("info1Label")
.textContent=c.info1;

document.getElementById("info2Label")
.textContent=c.info2;

}


/* =====================================================
   TECLADO COMERCIAL
===================================================== */

function teclaComercial(v){

if(!comercialAtivo)return;


/* IGUAL */

if(v==="="){

calcularComercial();

return;

}


/* AC */

if(v==="AC"){

valores[campoAtivo]="0";

atualizarCampo();

calcularComercial();

return;

}


/* APAGAR */

if(v==="BACK"){

if(
valores[campoAtivo].length<=1
){

valores[campoAtivo]="0";

}else{

valores[campoAtivo]=
valores[campoAtivo].slice(0,-1);

}

atualizarCampo();

calcularComercial();

return;

}


/* VÍRGULA */

if(v==="," ){

if(
!valores[campoAtivo].includes(",")
){

valores[campoAtivo]+=",";

}

atualizarCampo();

return;

}


/* ZERO */

if(
valores[campoAtivo]==="0"
){

valores[campoAtivo]="";

}


/* NÚMERO */

valores[campoAtivo]+=v;

atualizarCampo();

calcularComercial();

}


/* =====================================================
   TECLADO GERAL
===================================================== */

function tecla(v){

if(comercialAtivo){

teclaComercial(v);

}else{

teclaCalculadora(v);

}

}


/* =====================================================
   TROCAR MODO COMERCIAL
===================================================== */

function modoComercial(novo,botao){

modo=novo;

comercialAtivo=true;

document.getElementById("comercial")
.style.display="block";

document.getElementById("calc")
.style.display="none";


document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

botao.classList.add("active");


/*
Cada aba abre zerada.
*/

config[modo].campos.forEach(x=>{
valores[x[0]]="0";
});


montarCampos();

}


/* =====================================================
   CALCULADORA
===================================================== */

function abrirCalc(botao){

comercialAtivo=false;

document.getElementById("comercial")
.style.display="none";

document.getElementById("calc")
.style.display="flex";


document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));


if(botao){

botao.classList.add("active");

}else{

document
.querySelectorAll(".tab")[4]
.classList.add("active");

}


atualizarCalcTela();

}


/* =====================================================
   FORMATAÇÃO CALC
===================================================== */

function calcFormat(n){

if(!isFinite(n))return "Erro";

return Number(n).toLocaleString(
"pt-BR",
{
maximumFractionDigits:10
}
);

}


/* =====================================================
   ATUALIZAR CALC
===================================================== */

function atualizarCalcTela(){

let display=calcNumero;

if(
display==="-" ||
display==="."
){

display="0";

}

document.getElementById(
"calcValue"
).textContent=
display.includes(".")
?
display.replace(".",",")
:
calcFormat(Number(display));


document.getElementById(
"expression"
).textContent=
calcExpressao;

}


/* =====================================================
   DIGITAR CALC
===================================================== */

function calcDigit(d){

if(
calcNovoNumero ||
calcNumero==="0"
){

calcNumero=d;

calcNovoNumero=false;

}else{

calcNumero+=d;

}

atualizarCalcTela();

}


/* =====================================================
   DECIMAL
===================================================== */

function calcDecimal(){

if(calcNovoNumero){

calcNumero="0";
calcNovoNumero=false;

}

if(!calcNumero.includes(".")){

calcNumero+=".";

}

atualizarCalcTela();

}


/* =====================================================
   CALCULAR DUAS PARCELAS
===================================================== */

function executar(a,b,op){

a=Number(a);
b=Number(b);

if(op==="+")return a+b;
if(op==="-")return a-b;
if(op==="*")return a*b;
if(op==="/")return b===0?NaN:a/b;

return b;

}


/* =====================================================
   OPERADOR
===================================================== */

function calcOperator(op){

const atual=Number(calcNumero);


/*
Se já existe operação,
calcula antes de continuar.
*/

if(
calcOperacao!==null &&
!calcNovoNumero
){

const r=
executar(
calcResultado,
atual,
calcOperacao
);

if(!isFinite(r)){

calcNumero="Erro";
calcOperacao=null;
atualizarCalcTela();
return;

}

calcResultado=r;
calcNumero=String(r);

}


/*
Primeira operação.
*/

if(calcResultado===null){

calcResultado=atual;

}


/*
Expressão visível.
*/

let simbolo=op;

if(op==="*")simbolo="×";
if(op==="/")simbolo="÷";
if(op==="-")simbolo="−";


if(calcExpressao===""){

calcExpressao=
calcFormat(atual)+" "+simbolo;

}else{

calcExpressao=
calcExpressao+
" "+simbolo;

}


calcOperacao=op;

calcNovoNumero=true;

atualizarCalcTela();

}


/* =====================================================
   IGUAL
===================================================== */

function calcEquals(){

if(calcOperacao===null){

return;

}

const atual=Number(calcNumero);

const r=
executar(
calcResultado,
atual,
calcOperacao
);


if(!isFinite(r)){

calcNumero="Erro";

calcResultado=null;
calcOperacao=null;

atualizarCalcTela();

return;

}


/*
Mostra a conta completa.
*/

calcExpressao=
calcExpressao+
" "+
calcFormat(atual)+
" =";


calcNumero=String(r);

calcResultado=r;

calcOperacao=null;

calcNovoNumero=true;

atualizarCalcTela();

}


/* =====================================================
   PORCENTAGEM
===================================================== */

function calcPercent(){

const atual=Number(calcNumero);

if(!isFinite(atual))return;


/*
Calculadora comum:

200 + 10% = 220

200 - 10% = 180

200 × 10% = 20

200 ÷ 10% = 2000
*/

if(
calcResultado!==null &&
calcOperacao!==null
){

let percentual=
calcResultado*atual/100;

calcNumero=
String(percentual);

}else{

calcNumero=
String(atual/100);

}

atualizarCalcTela();

}


/* =====================================================
   APAGAR
===================================================== */

function calcBack(){

if(
calcNumero==="Erro"
){

calcClear();

return;

}

if(calcNumero.length<=1){

calcNumero="0";

}else{

calcNumero=
calcNumero.slice(0,-1);

}

atualizarCalcTela();

}


/* =====================================================
   LIMPAR CALCULADORA
===================================================== */

function calcClear(){

calcNumero="0";
calcResultado=null;
calcOperacao=null;
calcNovoNumero=false;
calcExpressao="";

atualizarCalcTela();

}
